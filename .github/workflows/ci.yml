name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Toolchain
        run: tools/bootstrap.sh && echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Format
        run: stylua --check engine platform tests game
      - name: Lint
        run: selene engine platform tests
      - name: Rojo build
        run: rojo build default.project.json -o /tmp/xonotic.rbxl
      - name: Headless tests
        run: lune run tests/run.luau
      - name: Tool tests
        run: python3 -m unittest discover -s tools -t . -p "test_*.py"
